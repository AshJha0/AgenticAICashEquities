# Pinned model ids and SDK version (PLAN D14). An id that is not listed here is refused at
# startup. Nothing in CI calls these models (D15): they are exercised only through fake
# clients, wire-contract tests and cassettes. Change a pin only together with CHANGELOG.

[sdk]
package = "anthropic"
version = "1.8.0"   # must match requirements.lock

[models]
# allowed ids and what they are for
"claude-opus-5-5" = "planning"
"claude-sonnet-5-5" = "narrative, critique"
"claude-haiku-5-5" = "judge paths (reserved)"

[purpose.planning]
model = "claude-opus-5-5"
fallback_model = "claude-sonnet-5-5"   # rung 1: used when the primary refuses
effort = "high"
max_tokens = 16000

[purpose.narrative]
model = "claude-sonnet-5-5"
fallback_model = "claude-opus-5-5"
effort = "medium"
max_tokens = 8000

[purpose.critique]
model = "claude-sonnet-5-5"
fallback_model = "claude-opus-5-5"
effort = "medium"
max_tokens = 8000

[purpose.judge]
model = "claude-haiku-5-5"
fallback_model = "claude-sonnet-5-5"
effort = "low"
max_tokens = 4000

# USD per million tokens, used ONLY for the local cost estimate and the task budget (3A.6).
# Source: the published list prices as cached on 2026-10-06; never fetched at run time.
[pricing."claude-opus-5-5"]
input = 4.00
output = 20.00
cache_read = 0.20
cache_write = 5.00

[pricing."claude-sonnet-5-5"]
input = 2.00
output = 10.00
cache_read = 0.20
cache_write = 2.50

[pricing."claude-haiku-5-5"]
input = 0.10
output = 0.50
cache_read = 0.01
cache_write = 0.125

# Prompt pins (A15): id = "version:sha256" of the canonical prompt bytes. Every prompt is checked
# against its pin when it is loaded; change a prompt only with its version header, this pin,
# tests/cassettes/prompt_hashes.json and a CHANGELOG line, all together.
[prompts]
planner = "3:8a5034b96237fd747815dd2fdd20e6e806bb4a5b6506eb6c0567b0cf2507fd44"
research_planner = "2:be03bc38e8b9dccab2d04248268aeaae3a5b0ba593e07ba2a6ed28f81d35acd7"
report = "2:b014be5021c234763983a4eebd7d0e2e6f107c2fbe9a7cfab7bc9474e0d92d38"
research_report = "2:7be2003af743c7245449558a50bc1cb291f076d1728560838c64f16807dcc6cf"
