# Gitleaks configuration: the default rules plus a narrow allowlist for documented fake values.
# Every entry says why it is not a secret. Real keys never match these patterns.
[extend]
useDefault = true

[allowlist]
description = "Documented development API keys and test fixtures (not secrets)"
regexes = [
  # The fixed demo keys of CEAP_ENV=dev (src/ceap/config.py; auditor added in 0.5.0, R4 4.3), shown in README/COOKBOOK curl examples.
  '''dev-(trader|viewer|admin|quant|approver|auditor|risk|engineer)-key''',
  # The fixed HMAC test key of the 0.8.0 audit-chain tests (tests/unit/test_r080_audit_safety.py, A6); a literal fixture, never a real key.
  '''test-key-0123456789abcdef0123456789abcdef''',
  # Canary tokens planted in the 0.9.0 prompt-injection corpus (src/ceap/eval/injection_corpus_v1.json):
  # the evaluation checks whether a model leaks them, so they must look like secrets. Never real keys.
  '''CNRY-[a-z]+-[0-9]{3}''',
]
