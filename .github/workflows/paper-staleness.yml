name: paper-staleness

# Dead-man's switch for the paper forward record (G6). Once a week, check that the head of the
# forward-log branch is no more than 2 NYSE sessions old. If it is older, the job fails and opens
# (or comments on) one GitHub issue labelled paper-stale. Runs only when PAPER_DAILY_ENABLED is
# 'true', like paper-daily.yml. Reads the branch; never writes to it.

on:
  schedule:
    - cron: "0 12 * * 1" # Monday 12:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: paper-staleness
  cancel-in-progress: true

jobs:
  check:
    if: ${{ vars.PAPER_DAILY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Read the forward-log head
        run: |
          git fetch --depth=1 origin forward-log-v2
          git show FETCH_HEAD:forward_log.csv > "$RUNNER_TEMP/forward_log.csv"
          git log -1 --format='forward-log-v2 head %h %cI %s' FETCH_HEAD
      - name: Check staleness against the NYSE calendar
        run: python scripts/check_forward_log_staleness.py --csv "$RUNNER_TEMP/forward_log.csv" --max-missed 2
      - name: Open or update the paper-stale issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create paper-stale --color B60205 --description "paper forward log stopped recording" 2>/dev/null || true
          n=$(gh issue list --label paper-stale --state open --json number --jq '.[0].number')
          body="The forward-log branch is more than 2 NYSE sessions behind, or could not be read. Run: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "Paper forward log is stale" --label paper-stale --body "$body"
          fi
