name: Release

# Triggered by pushing a tag such as v0.4.0. The gate refuses to release a commit whose CI is not
# green, whose version disagrees between pyproject, ceap.__version__ and the tag, whose CHANGELOG
# lacks the section, or whose tree fails the banned-word or licence checks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # H7: keyless signing (cosign) and build provenance use the workflow's OIDC identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: CycloneDX SBOM of the locked runtime environment (H7)
        run: |
          python -m pip install cyclonedx-bom==8.0.1
          cyclonedx-py requirements requirements.lock --of JSON -o dist/ceap-sbom.cdx.json
      - name: Build provenance attestation (SLSA, H7)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Cosign keyless signatures (H7; verify with cosign verify-blob --bundle)
        run: |
          for f in dist/*.whl dist/*.tar.gz dist/ceap-sbom.cdx.json; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done
      - name: Build image (smoke only; not pushed to any registry)
        run: |
          docker build -t "ceap:${GITHUB_REF_NAME}" .
          docker run --rm "ceap:${GITHUB_REF_NAME}" ceap --help
      - name: Create GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
