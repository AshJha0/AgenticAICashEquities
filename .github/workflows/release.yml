name: Release

# Triggered by pushing a tag such as v0.4.0. The gate refuses to release a commit whose CI is not
# green, whose version disagrees between pyproject, ceap.__version__ and the tag, whose CHANGELOG
# lacks the section, or whose tree fails the banned-word or licence checks.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Release gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_check.py --tag "${GITHUB_REF_NAME}" --sha "${GITHUB_SHA}" --repo "${GITHUB_REPOSITORY}"

  publish:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build==1.3.0
          python -m build
      - name: Build image (smoke only; not pushed to any registry)
        run: |
          docker build -t "ceap:${GITHUB_REF_NAME}" .
          docker run --rm "ceap:${GITHUB_REF_NAME}" ceap --help
      - name: Create GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 || index($0, "## " v " ") == 1 {f=1; next} /^## /{if(f) exit} f' CHANGELOG.md > notes.md
          gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
