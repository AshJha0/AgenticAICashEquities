name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requirements.lock pins exact versions for reproducible builds; it was
      # generated with `pip-compile --extra=all pyproject.toml` on Python 3.12
      # (see the header of the lockfile) and is not version-marker-aware, so
      # CI runs the single Python version it was generated for.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest
