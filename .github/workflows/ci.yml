name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the trailing comment). Bump them deliberately.
env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - run: ruff check .
      - run: mypy src
      - name: Banned-word check
        run: python scripts/check_banned_words.py
      - name: Docs numbers and commands match measured artefacts (3E.3)
        run: python scripts/check_docs.py
      - name: Contract and drift monitors (3E.4)
        env:
          ANTHROPIC_API_KEY: ""
        run: pytest -q -p no:randomly tests/contract --no-cov

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Pytest (PR tier, parallel, branch coverage floor 85 % on 3.12 only)
        env:
          ANTHROPIC_API_KEY: ""
          PYV: ${{ matrix.python-version }}
        # H13: coverage is measured once (3.12); 3.11 runs the same tests without the tracer.
        run: |
          if [ "$PYV" = "3.12" ]; then
            pytest -n auto -m "not nightly" --cov=ceap --cov-branch --cov-report=term --cov-fail-under=90
          else
            pytest -n auto -m "not nightly" --no-cov
          fi

  test-windows:
    # H4 (0.9.0): fast tier on Windows. Catches path, encoding and line-ending bugs the Linux jobs
    # cannot (the maintainer develops on Windows). Slow and nightly tiers stay on Linux.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Pytest (fast tier, no coverage)
        env:
          ANTHROPIC_API_KEY: ""
          PYTHONUTF8: "1"
        run: pytest -n auto -m "not slow and not nightly" --no-cov

  benchmarks:
    # H13 (0.9.0): regression gate. Base and head run on the same runner in the same job, so the
    # comparison is not confounded by runner hardware. Fails when any benchmark's mean is more
    # than 25 % slower on the PR head than on the base commit.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock) + pytest-benchmark (job-only tool, ADR 0003)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install pytest-benchmark==5.3.1
      - name: Benchmark the base commit, then the head, and compare
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          ANTHROPIC_API_KEY: ""
        run: |
          # pyproject's pytest `pythonpath = ["src", ...]` decides which src is imported, so each run
          # starts from its own tree: the head's benchmark files are copied into the base worktree.
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          cp -r benchmarks "$RUNNER_TEMP/base/"
          store="file://$GITHUB_WORKSPACE/.benchmarks"
          opts="-p no:randomly -p no:xdist --no-cov -o addopts= --benchmark-only --benchmark-min-rounds=20"
          (cd "$RUNNER_TEMP/base" && python -m pytest benchmarks $opts --benchmark-storage="$store" --benchmark-save=base)
          python -m pytest benchmarks $opts --benchmark-storage="$store" --benchmark-compare=0001 \
            --benchmark-compare-fail=mean:25%

  api-reference:
    # I2 (0.9.0): generated API reference. pdoc renders ceap.analytics and ceap.domain from their
    # docstrings and type annotations; the OpenAPI document is checked in at docs/api/openapi.json.
    # The HTML is an artifact, not committed (it is derived). pdoc is a job-only tool (ADR 0003).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Render with pdoc
        env:
          ANTHROPIC_API_KEY: ""
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install pdoc==16.0.0
          pdoc ceap.analytics ceap.domain -o api-reference --docformat restructuredtext
          cp docs/api/openapi.json api-reference/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-reference
          path: api-reference
          retention-days: 30

  lock-fresh:
    # The lock is produced by uv in universal mode on Linux and never edited by hand. Regenerating it
    # (uv prefers the versions already pinned) must give the committed file byte for byte.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Regenerate and compare
        run: |
          uv pip compile pyproject.toml --extra all --universal --generate-hashes --python-version 3.11 \
            --no-emit-package cash-equities-agentic-platform \
            --custom-compile-command "uv pip compile pyproject.toml --extra all --universal --generate-hashes --python-version 3.11 -o requirements.lock" \
            -o requirements.lock
          git diff --exit-code requirements.lock

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: pip-audit against the lock
        run: |
          python -m pip install --require-hashes -r requirements.lock
          pip-audit -r requirements.lock --require-hashes --disable-pip --progress-spinner off

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Gitleaks self-test (a planted fake key must be caught)
        run: |
          mkdir -p "$RUNNER_TEMP/planted" && cd "$RUNNER_TEMP/planted"
          printf 'aws_access_key_id = %s%s\n' "AKIA" "QYLPMN5HHHFPZAM2" > config.ini
          if docker run --rm -v "$PWD:/scan" "$GITLEAKS_IMAGE" detect --no-git --source /scan --no-banner; then
            echo "gitleaks missed a planted key"; exit 1
          fi
      - name: Gitleaks on the repository history
        run: |
          rc=0
          docker run --rm -v "$PWD:/repo" "$GITLEAKS_IMAGE" detect --source /repo --no-banner --redact \
            --report-format json --report-path /repo/gitleaks-report.json || rc=$?
          # Locations only (rule, file, line, commit); secret values stay redacted.
          jq -r '.[] | "\(.RuleID)\t\(.File):\(.StartLine)\t\(.Commit[0:10])\t\(.Fingerprint)"' gitleaks-report.json || true
          exit $rc

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build image and smoke-test the CLI
        run: |
          docker build -t ceap:ci .
          docker run --rm ceap:ci ceap --help

  compose:
    # R-26 (E4): the reverse-proxy example must start with hashed keys only and answer /health and
    # one authenticated call through Caddy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the compose stack and call it
        run: bash scripts/compose_smoke.sh

  changelog:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: CHANGELOG.md touched (or PR labelled no-changelog)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case ",$LABELS," in *,no-changelog,*) echo "no-changelog label: skipped"; exit 0;; esac
          if git diff --name-only "$BASE"...HEAD | grep -qx CHANGELOG.md; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::CHANGELOG.md not updated; add an entry under '## Unreleased' or label the PR no-changelog"
            exit 1
          fi

  contracts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Public ceap.domain signatures unchanged (or PR labelled contracts-change)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if python scripts/check_contracts.py "$BASE"; then exit 0; fi
          case ",$LABELS," in *,contracts-change,*) echo "contracts-change label present: allowed"; exit 0;; esac
          echo "::error::ceap.domain public signatures changed; label the PR contracts-change after review"
          exit 1
      - name: Install (hashed lock) for the OpenAPI export
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: OpenAPI document unchanged (or PR labelled contracts-change) (H15)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          ANTHROPIC_API_KEY: ""
        run: |
          if python scripts/export_openapi.py --check; then exit 0; fi
          python scripts/export_openapi.py --out "$RUNNER_TEMP/openapi.json"
          diff -u docs/api/openapi.json "$RUNNER_TEMP/openapi.json" | head -200 || true
          # A stale file always fails: the committed document must match the code, and the PR should
          # carry the contracts-change label so the reviewer reads the diff above.
          echo "::error::the API changed; regenerate docs/api/openapi.json (python scripts/export_openapi.py), commit it, and label the PR contracts-change"
          exit 1

  golden-change:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Golden set edits need the golden-change label and owner sign-off (3E.1)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "$BASE"...HEAD | grep -qx tests/golden/golden_set.json; then exit 0; fi
          case ",$LABELS," in *,golden-change,*) echo "golden-change label present: allowed"; exit 0;; esac
          echo "::error::tests/golden/golden_set.json changed; label the PR golden-change and record the owner sign-off"
          exit 1
      - name: Snapshot and cassette edits need the snapshot-change label (H10)
        # A snapshot or cassette is a recorded expected output; re-recording one can hide a
        # regression, so a reviewer has to look at the diff and label the PR. Adding a new file is
        # allowed without the label; modifying or deleting an existing one is not.
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDR "$BASE"...HEAD | grep -E '^tests/(cassettes|agent/snapshots|contract/snapshots)/' || true)
          if [ -z "$changed" ]; then exit 0; fi
          echo "$changed"
          case ",$LABELS," in *,snapshot-change,*) echo "snapshot-change label present: allowed"; exit 0;; esac
          echo "::error::recorded snapshots or cassettes changed; review the diff and label the PR snapshot-change"
          exit 1
