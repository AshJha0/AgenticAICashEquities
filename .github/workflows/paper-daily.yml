name: paper-daily

# Paper trading forward record (RP). paper, synthetic or free daily data, not trading.
# DISABLED by default: the job runs only when the repository variable PAPER_DAILY_ENABLED is 'true'.
# The owner turns it on (Settings > Secrets and variables > Actions > Variables). Nothing here places
# an order anywhere, calls a model, or needs a secret beyond the default GITHUB_TOKEN.

on:
  schedule:
    - cron: "30 21 * * 1-5" # 21:30 UTC, after the 16:00 New York close all year (EST and EDT)
  workflow_dispatch:
    inputs:
      date:
        description: "session date (YYYY-MM-DD); default: today in New York (G12)"
        required: false

permissions:
  contents: write # push to the forward-log-v2 branch only (forward-log is the kept 0.9.0 false start)
  issues: write # open or update the paper-failure issue when the run fails (G6)

concurrency:
  group: paper-daily
  cancel-in-progress: false

jobs:
  run-day:
    if: ${{ vars.PAPER_DAILY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CEAP_ENV: ci
      CEAP_LLM_PROVIDER: mock
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Check out the forward-log branch (create it on first run)
        run: |
          git config user.name "ceap-paper-bot"
          git config user.email "ceap-paper-bot@users.noreply.github.com"
          # actions/checkout fetches only the triggering ref, so origin/forward-log does not exist
          # locally until it is fetched; without this fetch every run after the first failed with
          # "invalid reference: origin/forward-log" (10 and 11 November 2026, R-02).
          if git ls-remote --exit-code --heads origin forward-log-v2 >/dev/null; then
            git fetch --no-tags origin +refs/heads/forward-log-v2:refs/remotes/origin/forward-log-v2
            git worktree add forward-log origin/forward-log-v2
            git -C forward-log switch -c forward-log-v2
          else
            git worktree add --detach forward-log
            git -C forward-log switch --orphan forward-log-v2
          fi
      - name: Run the session (paper-auto is allowed explicitly; audited in the ledger database)
        id: run
        run: |
          D="${{ github.event.inputs.date }}"
          D="${D:-$(TZ=America/New_York date +%F)}"
          set +e
          ceap paper run-day --date "$D" --db forward-log/paper.db --allow-paper-auto --report-dir forward-log/reports
          rc=$?
          set -e
          if [ "$rc" = "3" ]; then echo "not a session: nothing to record"; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit "$rc"
      - name: Verify, export and report
        if: steps.run.outputs.skip != '1'
        run: |
          ceap paper verify --db forward-log/paper.db
          ceap paper export --db forward-log/paper.db --out forward-log/forward_log.csv
          ceap paper report --db forward-log/paper.db > forward-log/REPORT.txt
          ceap paper verify-csv --csv forward-log/forward_log.csv
      - name: Append to the forward-log branch
        if: steps.run.outputs.skip != '1'
        run: |
          cd forward-log
          git add paper.db forward_log.csv REPORT.txt reports
          git commit -m "paper: forward log $(tail -n 1 forward_log.csv | cut -d, -f1) (paper, not trading)" || exit 0
          git push origin forward-log-v2
      - name: Open or update the paper-failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create paper-failure --color B60205 --description "paper-daily run failed" 2>/dev/null || true
          n=$(gh issue list --label paper-failure --state open --json number --jq '.[0].number')
          body="paper-daily failed on $(date -u +%F). Run: $RUN_URL"
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "paper-daily run failed" --label paper-failure --body "$body"
          fi
