name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      HYPOTHESIS_PROFILE: nightly
      CEAP_NIGHTLY: "1" # the nightly-marked sweeps skip without it (H9)
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock)
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Every tier, random order (state-leak check), 1000 hypothesis examples
        run: pytest -n auto -p randomly --cov=ceap --cov-branch --cov-report=term --cov-fail-under=90

  mutation:
    # H3 (0.9.0): mutmut on ceap.analytics and ceap.domain with a surviving-mutant ratchet
    # (scripts/mutation_ratchet.py, ceiling in tests/mutation/baseline.json). Job-only tool (ADR 0003).
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock) + mutmut
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install mutmut==3.8.1
      - name: Mutate and test
        run: mutmut run --max-children 4 || true # survivors are judged by the ratchet, not the exit code
      - name: Ratchet (survivors may fall, never rise)
        run: python scripts/mutation_ratchet.py

  api-fuzz:
    # H15 (0.9.0): Schemathesis fuzzes the live API from its own OpenAPI document. Read-only (GET)
    # operations only, so the run creates no tasks; the check is "no 5xx and responses match the
    # schema". Job-only tool (ADR 0003).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install (hashed lock) + schemathesis
        run: |
          python -m pip install --require-hashes -r requirements.lock
          python -m pip install -e . --no-deps
          python -m pip install schemathesis==4.33.1
      - name: Start the API and fuzz it
        run: |
          ceap serve --host 127.0.0.1 --port 8000 &
          for _ in $(seq 1 60); do curl -fs http://127.0.0.1:8000/health >/dev/null && break; sleep 1; done
          # The auditor key reads everything and can act on nothing (docs/api/api.md, development keys).
          schemathesis run http://127.0.0.1:8000/openapi.json --include-method GET \
            --header "X-API-Key: dev-auditor-key" --checks not_a_server_error,response_schema_conformance --max-examples 50
