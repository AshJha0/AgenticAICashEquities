[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cash-equities-agentic-platform"
version = "0.9.0"
description = "Enterprise-style Agentic AI platform for investigating cash-equity execution quality (Python + MCP + LLM + multi-agent harness)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ashish Nath Jha", email = "ashishnathjha@gmail.com" }]
keywords = ["agentic-ai", "mcp", "cash-equities", "tca", "execution-quality", "llm", "multi-agent"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pydantic>=2.5",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "mcp>=1.19,<2",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
quant = ["polars>=0.20", "pyarrow>=14", "duckdb>=0.10", "scipy>=1.11"]
ml = ["scikit-learn>=1.4"]
observability = [
    "opentelemetry-api>=1.22",
    "opentelemetry-sdk>=1.22",
    "prometheus-client>=0.19",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "pytest-randomly>=3.15",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "ruff>=0.3",
    "mypy>=1.8",
]
all = [
    "cash-equities-agentic-platform[llm,quant,ml,observability,dev]",
]

[project.scripts]
ceap = "ceap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ceap = ["py.typed", "llm/*.toml", "llm/prompts/*.md", "persistence/migrations/*.sql", "ml/*.json", "eval/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]
addopts = "-q -p no:randomly --durations=20"
# H8: every test has a 120 s ceiling; tests/conftest.py raises it for the slow (600 s) and
# nightly (1800 s) tiers unless the test sets its own @pytest.mark.timeout.
timeout = 120
# H9: one definition per marker.
markers = [
    "slow: longer tests (subprocesses, long simulations); run on every PR, skip locally with -m 'not slow'",
    "nightly: nightly tier (500-seed sweeps); deselected on PR with -m 'not nightly' and run by nightly.yml, which sets CEAP_NIGHTLY=1 (the tests skip without it)",
    "evaluation: scenario-based evaluation suite",
    "adversarial: adversarial / safety tests",
    "real_paper_clock: keep the wall clock for the paper completed-session guard (tests/conftest.py)",
]

[tool.coverage.run]
# E1 (C-P2-1): branch coverage of the installed package only; parallel for pytest-xdist workers
source = ["ceap"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = false
skip_covered = false
precision = 1
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    '@(abc.)?abstractmethod',
]

[tool.coverage.json]
output = "coverage.json"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "B008", "UP042"]  # B008: FastAPI Depends(); UP042: str-Enum kept for 3.11 JSON compat

[tool.mypy]
# Matches the Python version CI installs (numpy's stubs require 3.12 syntax
# regardless of this setting once numpy >= 2.1 is resolved); runtime support
# still targets Python >= 3.11 per requires-python above.
python_version = "3.12"
strict = false
# H1 (0.9.0): no global ignore_missing_imports. Third-party packages that ship no type
# information are listed by name below, so a typo'd or missing import still fails.
mypy_path = "src"

[[tool.mypy.overrides]]
# Per-module strict (H1): the domain contracts and the deterministic analytics.
# mypy cannot set `strict` per module, so the strict flag set is spelled out here.
module = ["ceap.domain.*", "ceap.analytics.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_return_any = true

[[tool.mypy.overrides]]
# ceap.api: the same strict flag set as domain/analytics, warn_return_any included (0.9.0).
module = ["ceap.api.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true
disallow_subclassing_any = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true
warn_return_any = true

[[tool.mypy.overrides]]
# Third-party packages without type information (no pandas-stubs, types-PyYAML, types-jsonschema, sklearn stubs;
# yfinance is an optional, lazily imported download tool for E1 and paper dividends). Named one by one.
module = ["jsonschema", "jsonschema.*", "yaml", "yaml.*", "pandas", "pandas.*", "sklearn", "sklearn.*", "yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.mutmut]
# H3 (0.9.0): nightly mutation testing (.github/workflows/nightly.yml, job `mutation`). mutmut is a
# job-only tool (ADR 0003) and needs Linux; scripts/mutation_ratchet.py enforces the ceiling.
paths_to_mutate = ["src/ceap/analytics/", "src/ceap/domain/"]
tests_dir = ["tests/unit/analytics/", "tests/properties/", "tests/unit/test_domain.py"]
pytest_add_cli_args = ["-p", "no:randomly", "--no-cov", "-o", "addopts="]
